<html lang="eu">

<head>
    <link rel="icon" type="image/png" href="/data/Portadak/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aramaixo Porra</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/db-loader.js"></script>
    <script>
        if (window.location.pathname.endsWith('.html')) {
            var newPath = window.location.pathname.slice(0, -5);
            history.replaceState(null, '', newPath);
        }
    </script>
    <script src="/js/layout.js" defer></script>
</head>

<body>
    <div class="etapa-navegazioa giro">
        <a href="../2023/" class="etapa-arrow giro">&#8592;</a>
        <span class="etapa-info giro">2024</span>
        <a href="../2025/" class="etapa-arrow giro">&#8594;</a>
    </div>
    <div class="container">
        <main>
            <section>
                <h2 class="giro">Giro d'Italia 2024</h2>

                <div class="download-section">
                    <a href="/data/Arauak%2C%20TxirrindulariZerrenda%20eta%20Porrak/Porrak/Porrak%20Giro%202024.pdf" class="download-button giro"
                        target="_blank">
                        PORRALARIEN LISTA (PDF)
                    </a>
                    <a href="/data/Arauak%2C%20TxirrindulariZerrenda%20eta%20Porrak/Arauak/Arauak%20giro%2024.pdf" class="download-button giro"
                        target="_blank">
                        ARAUAK (PDF)
                    </a>
                    <a href="/data/Arauak%2C%20TxirrindulariZerrenda%20eta%20Porrak/TxirrindulariZerrenda/Txirrindulari%20Zerrenda%20Giro%202024.pdf"
                        class="download-button giro" target="_blank">
                        DORTSALAK (PDF)
                    </a>
                </div>

                <div class="tables-container stacked">
                    <div class="table-wrapper" style="width: 100%; overflow-x: auto;">
                        <h3 class="giro" style="text-align: center;">PORRA SAILKAPENA</h3>
                        <div class="table-content">
                            <table class="sailkapena-table giro" id="porra-table" style="width: 100%; ">
                                <thead>
                                    <tr>
                                        <th>Pos</th>
                                        <th>Id</th>
                                        <th>Porralaria</th>
                                        <th>Puntuak</th>
                                        
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data will be loaded from CSV -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="table-wrapper" style="width: 100%; overflow-x: auto;">
                        <h3 class="giro" style="text-align: center;">TXIRRINDULARIAK</h3>
                        <div class="table-content">
                            <table class="sailkapena-table giro" id="txirrindulari-table" style="width: 100%; ">
                                <thead>
                                    <tr>
                                        <th>Pos</th>
                                        <th>Dortsala</th>
                                        <th>Txirrindularia</th>
                                        <th>Zenbatek?</th>
                                        <th>Puntuak</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data will be loaded from CSV -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tables-container stacked">
                    <div class="table-wrapper" style="width: 100%; overflow-x: auto;">
                        <h3 class="giro" style="text-align: center;">ETAPAZ ETAPA</h3>
                        <div id="etapak-container"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Giro D'Italia 2024 — Txapelketa_ID=2
            window.dbLoader.loadPorra(2, 'porra-table');
            window.dbLoader.loadCyclists(2, 'txirrindulari-table');
            window.dbLoader.loadStages(2, 'etapak-container', 'giro');
        });
    </script>
</body>

</html>
