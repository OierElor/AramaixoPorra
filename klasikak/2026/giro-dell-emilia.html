<!DOCTYPE html>
<html lang="eu">

<head>
    <link rel="icon" type="image/png" href="/data/Portadak/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aramaixo Porra</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script>
        if (window.location.pathname.endsWith('.html')) {
            var newPath = window.location.pathname.slice(0, -5);
            history.replaceState(null, '', newPath);
        }
    </script>
</head>

<body>
    <header>
        <h1>
            <a href="../../" style="color: inherit; text-decoration: none;">
                Aramaixo Porra
            </a>
        </h1>
        <nav class="karrerak">
            <ul>
                <li><a class="tour" href="../../tour/">Tour</a></li>
                <li><a class="giro" href="../../giro/">Giro</a></li>
                <li><a class="vuelta" href="../../vuelta/">Vuelta</a></li>
                <li><a class="klasikak" href="../../klasikak/">Klasikak</a></li>
            </ul>
        </nav>
    </header>
    <div class="etapa-navegazioa">
        <a href="../2026/" class="etapa-back-btn klasikak">2026</a>
        <button onclick="window.location.href='world-championship.html'" aria-label="Aurrekoa"
            class="etapa-arrow klasikak">&#8592;</button>
        
        <span class="etapa-info klasikak">Giro dell'Emilia</span>
        <button onclick="window.location.href='il-lombardia.html'" aria-label="Hurrengoa"
            class="etapa-arrow klasikak">&#8594;</button>
    </div>

    <main>
        <section>
            <h2 class="klasikak" style="text-align: center;">Giro dell'Emilia</h2>
            <p style="text-align: center; font-size: 1.2em; margin: -10px 0 20px 0;">
                <strong>Data:</strong> 2026/10/03 |
                <strong>UCI Kategoria:</strong> <span id="kategoria-badge" style="background-color: #e0e0e0; padding: 4px 12px; border-radius: 4px; font-weight: bold;">...</span>
            </p>
            <div class="table-wrapper no-box" style="margin-top: 30px; text-align: center;">
                <h3 class="klasikak" style="text-align: center;">PUNTUAZIO SISTEMA</h3>
                <div id="scoring-table-container"></div>
            </div>
            <script src="/js/scoring-loader.js"></script>
            <script>
                window.addEventListener('DOMContentLoaded', () => {
                    scoringLoader.loadFromKategoria('giro-dell-emilia', 'scoring-table-container', 'kategoria-badge');
                });
            </script>
        </section>

    </main>
</body>

</html>
