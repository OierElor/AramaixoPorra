<!DOCTYPE html>
<html lang="eu">

<head>
    <link rel="icon" type="image/png" href="/data/Portadak/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aramaixo Porra</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script>
        if (window.location.pathname.endsWith('.html')) {
            var newPath = window.location.pathname.slice(0, -5);
            history.replaceState(null, '', newPath);
        }
    </script>
</head>

<body>
    <header>
        <h1>
            <a href="../../" style="color: inherit; text-decoration: none;">
                Aramaixo Porra
            </a>
        </h1>
        <nav class="karrerak">
            <ul>
                <li><a class="tour" href="../../tour/">Tour</a></li>
                <li><a class="giro" href="../../giro/">Giro</a></li>
                <li><a class="vuelta" href="../../vuelta/">Vuelta</a></li>
                <li><a class="klasikak" href="../../klasikak/">Klasikak</a></li>
            </ul>
        </nav>
    </header>
    <div class="etapa-navegazioa">
        <a href="../2026/" class="etapa-back-btn klasikak">2026</a>
        <button onclick="window.location.href='amstel-gold-race.html'" aria-label="Aurrekoa"
            class="etapa-arrow klasikak">&#8592;</button>
        
        <span class="etapa-info klasikak">La Flèche Wallonne</span>
        <button onclick="window.location.href='liege-bastogne-liege.html'" aria-label="Hurrengoa"
            class="etapa-arrow klasikak">&#8594;</button>
    </div>

    <main>
        <section>
            <h2 class="klasikak" style="text-align: center;">La Flèche Wallonne</h2>
            <p style="text-align: center; font-size: 1.2em; margin: -10px 0 20px 0;">
                <strong>Data:</strong> 2026/04/22 |
                <strong>UCI Kategoria:</strong> <span id="kategoria-badge" style="background-color: #e0e0e0; padding: 4px 12px; border-radius: 4px; font-weight: bold;">...</span>
            </p>
            <div class="table-wrapper no-box" style="margin-top: 30px; text-align: center;">
                <h3 class="klasikak" style="text-align: center;">PUNTUAZIO SISTEMA</h3>
                <div id="scoring-table-container"></div>
            </div>
            <!-- Emaitzak -->
            <div class="table-wrapper no-box" style="margin-top: 30px; text-align: center;">
                <h3 class="klasikak" style="text-align: center;">SAILKAPENA</h3>
                <div class="table-content">
                    <table class="sailkapena-table klasikak" id="karrera-emaitzak"
                        style="width: 100%; max-width: 900px; margin: 0 auto;">
                        <thead>
                            <tr>
                                <th>Pos</th>
                                <th>Dortsala</th>
                                <th>Txirrindularia</th>
                                <th>Puntuak</th>
                                <th>Zenbatek</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="5" style="text-align:center; padding:20px;">Kargatzen...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <script src="/js/scoring-loader.js"></script>
            <script>
                // ── Emaitzak loader ───────────────────────────────────────────────
                async function loadEmaitzak() {
                    try {
                        const resp = await fetch('/data/CSV/klasikak/klasikak26/13/sailkapena.csv');
                        if (!resp.ok) {
                            document.querySelector('#karrera-emaitzak tbody').innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Emaitzak ez daude prest</td></tr>';
                            return;
                        }
                        const text = await resp.text();
                        // Lehenengo lerroa metadatua, bigarrena zutabe-izenburuak, gainerakoak datuak
                        const lines = text.trim().split('\n').slice(2);
                        const tbody = document.querySelector('#karrera-emaitzak tbody');
                        tbody.innerHTML = '';
                        lines.forEach((line, i) => {
                            const parts = line.split(',').map(s => s.trim());
                            if (!parts[0]) return;
                            const tr = document.createElement('tr');
                            if (i === 0) { tr.style.backgroundColor = '#fff4cc'; tr.style.fontWeight = 'bold'; }
                            else if (i === 1) { tr.style.backgroundColor = '#f0f0f0'; }
                            else if (i === 2) { tr.style.backgroundColor = '#fde8d0'; }
                            [parts[0], parts[1], parts[2], parts[3], parts[4]].forEach(val => {
                                const td = document.createElement('td');
                                td.textContent = val ?? '';
                                tr.appendChild(td);
                            });
                            tbody.appendChild(tr);
                        });
                    } catch (error) {
                        console.error('Errorea emaitzak kargatzean:', error);
                        document.querySelector('#karrera-emaitzak tbody').innerHTML = '<tr><td colspan="5" style="text-align:center; padding:20px;">Emaitzak ez daude prest</td></tr>';
                    }
                }

                window.addEventListener('DOMContentLoaded', () => {
                    scoringLoader.loadFromKategoria('la-fleche-wallonne', 'scoring-table-container', 'kategoria-badge');
                    loadEmaitzak();
                });
            </script>
        </section>

    </main>
</body>

</html>
