<html lang="eu">

<head>
    <link rel="icon" type="image/png" href="/data/Portadak/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aramaixo Porra - Tour 2025</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/db-loader.js"></script>
    <script>
        if (window.location.pathname.endsWith('.html')) {
            var newPath = window.location.pathname.slice(0, -5);
            history.replaceState(null, '', newPath);
        }
    </script>
    <script src="/js/layout.js" defer></script>
</head>

<body>
    <div class="etapa-navegazioa tour">
        <a href="../2024/" class="etapa-arrow tour">&#8592;</a>
        <span class="etapa-info tour">2025</span>
        <a href="../2026/" class="etapa-arrow tour">&#8594;</a>
    </div>
    <div class="container">
        <main>
            <section>
                <h2 class="tour">Tour de France 2025</h2>

                <div class="download-section">
                    <a href="/data/Arauak%2C%20TxirrindulariZerrenda%20eta%20Porrak/Porrak/Porrak%20Tour%202025.pdf"
                        class="download-button tour" target="_blank">
                        PORRALARIEN LISTA (PDF)
                    </a>
                    <a href="/data/Arauak%2C%20TxirrindulariZerrenda%20eta%20Porrak/Arauak/Arauak%20tour%2025.pdf" class="download-button tour"
                        target="_blank">
                        ARAUAK (PDF)
                    </a>
                    <a href="/data/Arauak%2C%20TxirrindulariZerrenda%20eta%20Porrak/TxirrindulariZerrenda/Txirrindulari%20Zerrenda%20Tour%202025.pdf" class="download-button tour"
                        target="_blank">
                        DORTSALAK (PDF)
                    </a>
                </div>

                <div class="tables-container stacked">
                    <div class="table-wrapper" style="width: 100%; overflow-x: auto;">
                        <h3 class="tour" style="text-align: center;">PORRA SAILKAPENA</h3>
                        <div class="table-content">
                            <table class="sailkapena-table tour" id="porra-table" style="width: 100%; ">
                                <thead>
                                    <tr>
                                        <th rowspan="2">Pos</th>
                                        <th rowspan="2">Id</th>
                                        <th rowspan="2">Porralaria</th>
                                        <th rowspan="2">Puntuak</th>
                                        <th colspan="6" style="border-bottom: 2px solid #000;">Etapetako sailkapena</th>
                                        <th rowspan="2">Saria</th>
                                    </tr>
                                    <tr>
                                        <th>1.</th>
                                        <th>2.</th>
                                        <th>3.</th>
                                        <th>4.</th>
                                        <th>5.</th>
                                        <th>6.</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data will be loaded from CSV -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="table-wrapper" style="width: 100%; overflow-x: auto;">
                        <h3 class="tour" style="text-align: center;">TXIRRINDULARIAK</h3>
                        <div class="table-content">
                            <table class="sailkapena-table tour" id="txirrindulari-table" style="width: 100%; ">
                                <thead>
                                    <tr>
                                        <th>Pos</th>
                                        <th>Dortsala</th>
                                        <th>Txirrindularia</th>
                                        <th>Zenbatek?</th>
                                        <th>Etapetan</th>
                                        <th>Mendia</th>
                                        <th>Sailkapena</th>
                                        <th>Guztira</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data will be loaded from CSV -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tables-container stacked">
                    <div class="table-wrapper" style="width: 100%; overflow-x: auto;">
                        <h3 class="tour" style="text-align: center;">ETAPAZ ETAPA</h3>
                        <div id="etapak-container"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Tour de France 2025 — Txapelketa_ID=6
            window.dbLoader.loadPorra(6, 'porra-table');
            window.dbLoader.loadCyclists(6, 'txirrindulari-table');
            window.dbLoader.loadStages(6, 'etapak-container', 'tour');
        });
    </script>
</body>

</html>
