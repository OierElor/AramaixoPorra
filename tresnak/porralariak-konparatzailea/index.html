<!DOCTYPE html>
<html lang="eu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aramaixo Porra - Porralariak konparatzailea</title>
    <link rel="stylesheet" href="/css/styles.css?v=20260822">
    <link rel="icon" type="image/png" href="/data/portadak/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/js/db-loader.js?v=20260822"></script>
    <script src="/js/tresna-komuna.js?v=20260822"></script>
    <script>
        if (window.location.pathname.endsWith('.html')) {
            history.replaceState(null, '', window.location.pathname.slice(0, -5));
        }
    </script>
    <script src="/js/layout.js?v=20260822" defer></script>
</head>

<body>

    <div class="container">
        <main>
            <section>
                <h2 class="grafikoak" style="text-align:center;">Porralariak konparatzailea</h2>
                <p style="text-align:center; opacity:.7; margin-top:-6px;">
                    Aukeratu 2-4 porralari txapelketa guztietan alderatzeko.
                </p>

                <div class="grafiko-kontrolak">
                    <div>
                        <label>Lasterketa mota</label>
                        <div class="grafiko-mota" id="mota-toggle">
                            <button data-f="denak" class="active">Denak</button>
                            <button data-f="itzuliak">Itzuliak</button>
                            <button data-f="klasikak">Klasikak</button>
                        </div>
                    </div>
                </div>

                <div class="grafiko-kontrolak">
                    <div>
                        <label for="pl-input">Gehitu porralaria (bilatu) — gehienez 4</label>
                        <span style="display:inline-flex;gap:6px;">
                            <input id="pl-input" placeholder="Idatzi izena edo hautatu..."
                                autocomplete="off"
                                style="padding:8px 10px;border:1px solid #bbb;border-radius:6px;min-width:240px;">
                            <button id="gehitu-btn" type="button" class="gehitu-btn">+ Gehitu</button>
                        </span>
                    </div>
                </div>

                <div class="grafiko-chipak" id="chip-zerrenda"></div>
                <div id="konp-edukia"></div>
            </section>
        </main>
    </div>

    <script>
        const MAX = 4;
        const state = { guztiak: [], hautatuak: [], mota: 'denak', chart: null };
        const isKlasika = txap => /klasik/i.test(txap);

        // Txapelketa bateko porra array batetik postu onena (ofiziala, baxuena = onena)
        function bestPos(rows) {
            const poses = rows.filter(r => r.pos != null).map(r => Number(r.pos));
            return poses.length ? Math.min(...poses) : null;
        }

        async function init() {
            state.guztiak = await Tresna.q(
                "SELECT Porralaria_ID AS id, Izena AS izena FROM Porralariak ORDER BY Izena");

            document.querySelectorAll('#mota-toggle button').forEach(b =>
                b.addEventListener('click', () => {
                    document.querySelectorAll('#mota-toggle button').forEach(x => x.classList.remove('active'));
                    b.classList.add('active');
                    state.mota = b.dataset.f;
                    render();
                }));

            const plInp = document.getElementById('pl-input');
            Tresna.autocomplete(
                plInp,
                state.guztiak.map(p => ({ id: p.id, label: p.izena })),
                item => {
                    if (state.hautatuak.some(h => h.id === item.id) || state.hautatuak.length >= MAX) return;
                    plInp.value = '';
                    const p = state.guztiak.find(x => x.id === item.id);
                    if (!p) return;
                    state.hautatuak.push(p);
                    renderChips();
                    render();
                }
            );
            document.getElementById('gehitu-btn').addEventListener('click', addFromInput);
        }

        function addFromInput() {
            const inp = document.getElementById('pl-input');
            const val = inp.value.trim().toLowerCase();
            inp.value = '';
            if (!val) return;
            const p = state.guztiak.find(x => x.izena.toLowerCase() === val);
            if (!p || state.hautatuak.some(h => h.id === p.id) || state.hautatuak.length >= MAX) return;
            state.hautatuak.push(p);
            renderChips();
            render();
        }

        function renderChips() {
            const box = document.getElementById('chip-zerrenda');
            box.innerHTML = state.hautatuak.length
                ? state.hautatuak.map((p, i) => {
                    const color = Tresna.COLORS[i % Tresna.COLORS.length];
                    return `<button type="button" class="grafiko-chip" data-id="${p.id}" ` +
                        `style="border-color:${color};color:${color};">${p.izena} ` +
                        `<span class="chip-x">×</span></button>`;
                }).join('')
                : '<span style="opacity:.6;">Gehitu 2-4 porralari bilatzailetik.</span>';
            box.querySelectorAll('.grafiko-chip').forEach(btn =>
                btn.addEventListener('click', () => {
                    state.hautatuak = state.hautatuak.filter(x => String(x.id) !== btn.dataset.id);
                    renderChips();
                    render();
                }));
        }

        async function fetchHistory(porralariId) {
            return Tresna.q(
                "SELECT tx.Txapelketa_ID AS txid, tx.Izena AS txap, tx.Urtea AS urtea, " +
                "  pe.Ezizena AS ezizena, e.Posizioa AS pos, e.Puntuak AS pts, " +
                "  (SELECT COUNT(*) FROM PorraEzizenak WHERE Txapelketa_ID = pe.Txapelketa_ID) AS np " +
                "FROM PorralariTaldeenEzizenak te " +
                "JOIN PorraEzizenak pe ON pe.Ezizen_ID = te.Ezizen_ID " +
                "JOIN Txapelketak tx ON tx.Txapelketa_ID = pe.Txapelketa_ID " +
                "LEFT JOIN TxapelketaEmaitzaPorralariak e " +
                "  ON e.Ezizen_ID = pe.Ezizen_ID AND e.Txapelketa_ID = pe.Txapelketa_ID " +
                "WHERE te.Porralaria_ID = ? ORDER BY tx.Urtea ASC, tx.Izena", [porralariId]);
        }

        async function render() {
            const cont = document.getElementById('konp-edukia');
            if (state.hautatuak.length < 2) {
                cont.innerHTML = '<p style="text-align:center;opacity:.6;">Aukeratu gutxienez 2 porralari.</p>';
                if (state.chart) { state.chart.destroy(); state.chart = null; }
                return;
            }
            cont.innerHTML = '<p style="text-align:center;opacity:.6;">Kargatzen...</p>';

            try {
                const histories = await Promise.all(state.hautatuak.map(p => fetchHistory(p.id)));

                const filtered = histories.map(hist => hist.filter(r => {
                    if (state.mota === 'itzuliak') return !isKlasika(r.txap);
                    if (state.mota === 'klasikak') return isKlasika(r.txap);
                    return true;
                }));

                // Txapelketa guztien batasena, kronologikoki
                const txMeta = new Map();
                filtered.forEach(hist => hist.forEach(r => {
                    if (!txMeta.has(r.txid)) txMeta.set(r.txid, { txid: r.txid, txap: r.txap, urtea: r.urtea });
                }));
                const txList = [...txMeta.values()].sort((a, b) => a.urtea - b.urtea || a.txap.localeCompare(b.txap));

                // txid → porra[] (porra guztiak txapelketa bakoitzean, porralari bakoitzeko)
                const histMaps = filtered.map(hist => {
                    const m = new Map();
                    hist.forEach(r => {
                        if (!m.has(r.txid)) m.set(r.txid, []);
                        m.get(r.txid).push(r);
                    });
                    return m;
                });

                // Estatistikak: txapelketa bakoitzeko postu onena hartu
                const stats = state.hautatuak.map((p, i) => {
                    const txids = [...histMaps[i].keys()];
                    const txPoses = txids.map(txid => bestPos(histMaps[i].get(txid))).filter(v => v != null);
                    const garaipenak = txPoses.filter(x => x === 1).length;
                    const podioak = txPoses.filter(x => x <= 3).length;
                    const avgPos = txPoses.length
                        ? (txPoses.reduce((a, b) => a + b, 0) / txPoses.length).toFixed(1) : '—';
                    return { part: txids.length, garaipenak, podioak, avgPos };
                });

                // Head-to-head: txapelketa bakoitzean postu onena konparatu
                let h2hHtml = '';
                if (state.hautatuak.length === 2) {
                    let wins = [0, 0], draws = 0;
                    txList.forEach(tx => {
                        const p0 = bestPos(histMaps[0].get(tx.txid) || []);
                        const p1 = bestPos(histMaps[1].get(tx.txid) || []);
                        if (p0 != null && p1 != null) {
                            if (p0 < p1) wins[0]++;
                            else if (p1 < p0) wins[1]++;
                            else draws++;
                        }
                    });
                    const c0 = Tresna.COLORS[0], c1 = Tresna.COLORS[1];
                    h2hHtml = `<div class="grafiko-oihala" style="text-align:center;">
                        <div style="font-size:1.15em;font-weight:bold;">
                            <span style="color:${c0};">${state.hautatuak[0].izena}</span>
                            <span style="margin:0 12px;font-size:1.3em;">${wins[0]} – ${wins[1]}</span>
                            <span style="color:${c1};">${state.hautatuak[1].izena}</span>
                        </div>
                        ${draws ? `<div style="opacity:.55;font-size:.85em;margin-top:3px;">${draws} berdinketa</div>` : ''}
                        <div style="opacity:.55;font-size:.82em;margin-top:2px;">Zuzeneko aurrez-aurrekoa — lasterketa bakoitzean posturik onena</div>
                    </div>`;
                }

                // Laburpen txartelak
                const summaryHtml = state.hautatuak.map((p, i) => {
                    const color = Tresna.COLORS[i % Tresna.COLORS.length];
                    const s = stats[i];
                    return `<div style="text-align:center;padding:8px 16px;">
                        <div style="font-weight:bold;color:${color};font-size:1.05em;">${p.izena}</div>
                        <div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-top:6px;">
                            <div><div style="font-size:1.4em;font-weight:bold;">${s.part}</div><div style="opacity:.6;font-size:.82em;">Txapelketak</div></div>
                            <div><div style="font-size:1.4em;font-weight:bold;">${s.garaipenak}</div><div style="opacity:.6;font-size:.82em;">Garaipenak</div></div>
                            <div><div style="font-size:1.4em;font-weight:bold;">${s.podioak}</div><div style="opacity:.6;font-size:.82em;">Podioak</div></div>
                            <div><div style="font-size:1.4em;font-weight:bold;">${s.avgPos}</div><div style="opacity:.6;font-size:.82em;">Batez b. pos.</div></div>
                        </div>
                    </div>`;
                }).join('');

                // Taula: txapelketa bakoitzeko zelda bakoitzean porra guztiak erakutsi
                const thead = `<tr><th>Lasterketa</th>${state.hautatuak.map((p, i) => {
                    const color = Tresna.COLORS[i % Tresna.COLORS.length];
                    return `<th style="color:${color};">${p.izena}</th>`;
                }).join('')}</tr>`;

                const renderCell = rows => {
                    if (!rows || !rows.length) return `<td style="opacity:.3;">—</td>`;
                    const sorted = rows.slice().sort((a, b) => (a.pos ?? 9999) - (b.pos ?? 9999));
                    if (sorted.length === 1) {
                        const r = sorted[0];
                        if (r.pos == null) return `<td style="opacity:.6;font-style:italic;">martxan</td>`;
                        const pts = r.pts != null ? ` · ${r.pts} p.` : '';
                        return `<td class="points-col">${r.pos}. <span style="opacity:.5;">/ ${r.np}</span>${pts}</td>`;
                    }
                    // Hainbat porra: denak lerrokatu
                    const lines = sorted.map(r => {
                        if (r.pos == null) return `<span style="opacity:.6;font-style:italic;">${r.ezizena}: martxan</span>`;
                        const pts = r.pts != null ? ` · ${r.pts}p.` : '';
                        return `${r.pos}.<span style="opacity:.5;">/${r.np}</span>${pts} <span style="opacity:.55;font-size:.8em;">(${r.ezizena})</span>`;
                    });
                    return `<td class="points-col" style="line-height:1.7;">${lines.join('<br>')}</td>`;
                };

                const tbody = txList.map(tx => {
                    const cells = histMaps.map(m => renderCell(m.get(tx.txid))).join('');
                    return `<tr><td class="name-col">${tx.txap}</td>${cells}</tr>`;
                }).join('');

                // Grafiko: txapelketa bakoitzeko postu onena (Y alderantzikatua)
                const datasets = state.hautatuak.map((p, i) => {
                    const color = Tresna.COLORS[i % Tresna.COLORS.length];
                    return {
                        label: p.izena,
                        data: txList.map(tx => bestPos(histMaps[i].get(tx.txid) || [])),
                        borderColor: color, backgroundColor: color,
                        borderWidth: 2, pointRadius: 4, tension: 0.15, spanGaps: false,
                    };
                });

                cont.innerHTML = `
                    <div class="grafiko-oihala" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
                        ${summaryHtml}
                    </div>
                    ${h2hHtml}
                    <div class="grafiko-oihala">
                        <h3 class="grafikoak" style="text-align:center;">POSIZIOEN EBOLUZIOA</h3>
                        <p style="text-align:center;opacity:.55;font-size:.82em;margin-top:-4px;">Hainbat porra baditu txapelketa batean, onena erakusten da</p>
                        <div style="position:relative;height:340px;"><canvas id="konp-grafikoa"></canvas></div>
                    </div>
                    <div class="table-wrapper" style="max-width:900px;margin:16px auto;overflow-x:auto;">
                        <h3 class="grafikoak" style="text-align:center;">TXAPELKETA GUZTIAK</h3>
                        <div class="table-content">
                            <table class="sailkapena-table klasikak">
                                <thead>${thead}</thead><tbody>${tbody}</tbody>
                            </table>
                        </div>
                    </div>`;

                // Errendatzaile PARTEKATUA (`Tresna.lineChart`). Datu-logika berezia da
                // (ardatza = txapelketak, ez karrerak), baina itxura eta tooltip-ak
                // beste grafiko-tresnekin bateratuta daude.
                if (state.chart) state.chart.destroy();
                state.chart = Tresna.lineChart(document.getElementById('konp-grafikoa'), {
                    labels: txList.map(tx => tx.txap),
                    datasets,
                    xTitle: 'Txapelketa',
                    yTitle: 'Posizioa (1. onena)',
                    alderantziz: true,
                    tooltipEtiketa: c => c.raw != null
                        ? `${c.dataset.label}: ${c.raw}. postua`
                        : `${c.dataset.label}: parte hartu gabe`,
                });
            } catch (err) {
                cont.innerHTML = `<p style="text-align:center;color:red;">Errorea: ${err.message}</p>`;
                console.error(err);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
