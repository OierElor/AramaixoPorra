<!DOCTYPE html>
<html lang="eu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aramaixo Porra - Txirrindulari fitxa</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/png" href="/data/Portadak/favicon.png">
    <script src="/js/db-loader.js"></script>
    <script src="/js/tresna-komuna.js"></script>
    <script>
        if (window.location.pathname.endsWith('.html')) {
            history.replaceState(null, '', window.location.pathname.slice(0, -5));
        }
    </script>
    <script src="/js/layout.js" defer></script>
</head>

<body>

    <div class="container">
        <main>
            <section>
                <h2 class="grafikoak" style="text-align:center;">Txirrindulari fitxa</h2>
                <div class="grafiko-kontrolak">
                    <div>
                        <label for="tx-input">Txirrindularia (bilatu)</label>
                        <input id="tx-input" placeholder="Idatzi izena edo hautatu..."
                            autocomplete="off" style="padding:8px 10px;border:1px solid #bbb;border-radius:6px;min-width:260px;">
                    </div>
                </div>
                <div id="fitxa-edukia"></div>
            </section>
        </main>
    </div>

    <script>
        const state = { guztiak: [] };

        async function init() {
            state.guztiak = await Tresna.q(
                "SELECT Txirrindularia_ID AS id, Izena AS izena FROM Txirrindulariak ORDER BY Izena");
            Tresna.autocomplete(
                document.getElementById('tx-input'),
                state.guztiak.map(t => ({ id: t.id, label: t.izena })),
                item => {
                    const t = state.guztiak.find(x => x.id === item.id);
                    if (t) renderFitxa(t);
                }
            );
        }

        async function partaidetzak(id) {
            return Tresna.q(
                "SELECT tx.Izena AS txap, tx.Urtea AS urtea, h.Dortsala AS dortsala, " +
                " e.Posizioa AS pos, e.Puntuak AS pts, " +
                " (SELECT COUNT(*) FROM PorraApustuak pa WHERE pa.Txapelketa_ID = tx.Txapelketa_ID AND pa.Txirrindularia_ID = ?) AS zenbatek, " +
                " (SELECT COUNT(DISTINCT Ezizen_ID) FROM PorraApustuak WHERE Txapelketa_ID = tx.Txapelketa_ID) AS nporra " +
                "FROM Txapelketak tx " +
                "LEFT JOIN TxapelketaEmaitzaTxirrindulariak e ON e.Txapelketa_ID = tx.Txapelketa_ID AND e.Txirrindularia_ID = ? " +
                "LEFT JOIN TxirrindulariakTxapleketanParteHartzea h ON h.TxapelketaID = tx.Txapelketa_ID AND h.TxirrindulariaID = ? " +
                "WHERE e.Txirrindularia_ID IS NOT NULL OR h.TxirrindulariaID IS NOT NULL " +
                "   OR EXISTS (SELECT 1 FROM PorraApustuak pa WHERE pa.Txapelketa_ID = tx.Txapelketa_ID AND pa.Txirrindularia_ID = ?) " +
                "ORDER BY tx.Urtea DESC, tx.Izena", [id, id, id, id]);
        }

        async function renderFitxa(t) {
            const cont = document.getElementById('fitxa-edukia');
            cont.innerHTML = '<p style="text-align:center;opacity:.6;">Kargatzen...</p>';

            const lerroak = await partaidetzak(t.id);
            const puntuV = lerroak.filter(r => r.pts != null).map(r => Number(r.pts));
            const guztira = puntuV.reduce((a, b) => a + b, 0);
            const posV = lerroak.filter(r => r.pos != null).map(r => r.pos);
            const onena = posV.length ? Math.min(...posV) : null;
            const garaipenak = posV.filter(p => p === 1).length;

            const body = lerroak.map(r => {
                const pos = r.pos != null ? r.pos + '.' : '<span style="opacity:.5;">—</span>';
                const pct = r.nporra ? Math.round(100 * r.zenbatek / r.nporra) : 0;
                const auk = `${r.zenbatek} <span style="opacity:.5;">/ ${r.nporra} (${pct}%)</span>`;
                let tr = '<tr';
                if (r.pos === 1) tr += ' style="background:#fff4cc;font-weight:bold;"';
                return tr + `><td class="name-col">${r.txap}</td><td>${r.dortsala ?? '—'}</td>` +
                    `<td>${pos}</td><td class="points-col">${r.pts ?? '—'}</td><td>${auk}</td></tr>`;
            }).join('');

            cont.innerHTML = `
                <div class="grafiko-oihala" style="text-align:center;">
                    <h3 class="grafikoak" style="margin:4px 0;">${t.izena}</h3>
                    <div style="display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin:8px 0;">
                        <div><div style="font-size:1.6em;font-weight:bold;">${lerroak.length}</div><div style="opacity:.6;">Txapelketak</div></div>
                        <div><div style="font-size:1.6em;font-weight:bold;">${garaipenak}</div><div style="opacity:.6;">1. postuak</div></div>
                        <div><div style="font-size:1.6em;font-weight:bold;">${onena != null ? onena + '.' : '—'}</div><div style="opacity:.6;">Postu onena</div></div>
                        <div><div style="font-size:1.6em;font-weight:bold;">${guztira}</div><div style="opacity:.6;">Puntu guztira</div></div>
                    </div>
                </div>
                <div class="table-wrapper" style="max-width:820px;margin:14px auto;overflow-x:auto;">
                    <h3 class="grafikoak" style="text-align:center;">PARTAIDETZAK</h3>
                    <div class="table-content">
                        <table class="sailkapena-table klasikak">
                            <thead><tr><th>Txapelketa</th><th>Dortsala</th><th>Postua</th><th>Puntuak</th><th>Aukeratua</th></tr></thead>
                            <tbody>${body}</tbody>
                        </table>
                    </div>
                </div>`;
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
