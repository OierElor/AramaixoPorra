<html lang="eu">

<head>
    <link rel="icon" type="image/png" href="/data/Portadak/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aramaixo Porra</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/db-loader.js"></script>
    <script>
        if (window.location.pathname.endsWith('.html')) {
            var newPath = window.location.pathname.slice(0, -5);
            history.replaceState(null, '', newPath);
        }
    </script>
</head>

<body>
    <header>
        <h1>
            <a href="../../" style="color: inherit; text-decoration: none;">
                Aramaixo Porra
            </a>
        </h1>
        <nav class="karrerak">
            <ul>
                <li><a class="tour" href="../../tour/">Tour</a></li>
                <li><a class="giro" href="../../giro/">Giro</a></li>
                <li><a class="vuelta" href="../../vuelta/">Vuelta</a></li>
                <li><a class="klasikak" href="../../klasikak/">Klasikak</a></li>
            </ul>
        </nav>
    </header>
    <div class="etapa-navegazioa vuelta">
        <button class="etapa-arrow vuelta disabled" disabled>&#8592;</button>
        <span class="etapa-info vuelta">2020</span>
        <a href="../2021/" class="etapa-arrow vuelta">&#8594;</a>
    </div>
    <div class="container">
        <main>
            <section>
                <h2 class="vuelta">Vuelta a España 2020</h2>
                <div class="download-section">
                    <a href="/data/Arauak%20eta%20Startlist/Arauak%20vuelta%2020.pdf"
                        class="download-button vuelta" target="_blank">
                        ARAUAK (PDF)
                    </a>
                    <a href="/data/Arauak%20eta%20Startlist/StartList%20vuelta%2020.pdf"
                        class="download-button vuelta" target="_blank">
                        DORTSALAK (PDF)
                    </a>
                </div>

                <div class="tables-container stacked">
                    <div class="table-wrapper" style="width: 100%; overflow-x: auto;">
                        <h3 class="vuelta" style="text-align: center;">PORRA SAILKAPENA</h3>
                        <div class="table-content">
                            <table class="sailkapena-table vuelta" id="porra-table" style="width: 100%; ">
                                <thead>
                                    <tr>
                                        <th>Pos</th>
                                        <th>Id</th>
                                        <th>Porralaria</th>
                                        <th>Puntuak</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data will be loaded from CSV -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="table-wrapper" style="width: 100%; overflow-x: auto;">
                        <h3 class="vuelta" style="text-align: center;">TXIRRINDULARIAK</h3>
                        <div class="table-content">
                            <table class="sailkapena-table vuelta" id="txirrindulari-table" style="width: 100%; ">
                                <thead>
                                    <tr>
                                        <th>Pos</th>
                                        <th>Dortsala</th>
                                        <th>Txirrindularia</th>
                                        <th>Zenbatek?</th>
                                        <th>Puntuak</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Data will be loaded from CSV -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tables-container stacked">
                    <div class="table-wrapper" style="width: 100%; overflow-x: auto;">
                        <h3 class="vuelta" style="text-align: center;">ETAPAZ ETAPA</h3>
                        <div id="etapak-container"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Vuelta a España 2020 — Txapelketa_ID=7
            window.dbLoader.loadPorra(7, 'porra-table');
            window.dbLoader.loadCyclists(7, 'txirrindulari-table');
            window.dbLoader.loadStages(7, 'etapak-container', 'vuelta');
        });
    </script>
</body>

</html>
