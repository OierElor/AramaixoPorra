    <script>
        if (window.location.pathname.endsWith('.html')) {
            var newPath = window.location.pathname.slice(0, -5);
            history.replaceState(null, '', newPath);
        }
    </script>
</head>

<body>
    <header>
        <h1>
            <a href="../../" style="color: inherit; text-decoration: none;">
                Aramaixo Porra
            </a>
        </h1>
        <nav class="karrerak">
            <ul>
                <li><a class="tour" href="/tour/">Tour</a></li>
                <li><a class="giro" href="/giro/">Giro</a></li>
                <li><a class="vuelta" href="/vuelta/">Vuelta</a></li>

                <li><a class="grafikoak" href="/tresnak/">Tresnak</a></li>
            </ul>
        </nav>
    </header>
    <div class="etapa-navegazioa vuelta">
        <a href="../2026/" class="etapa-back-btn vuelta">2026</a>
        <button onclick="window.location.href='etapa11.html'" aria-label='Aurrekoa' class='etapa-arrow vuelta'>&#8592;</button>
        
        <span class="etapa-info vuelta">Etapa 12</span>
        <button onclick="window.location.href='etapa13.html'" aria-label='Hurrengoa' class='etapa-arrow vuelta'>&#8594;</button>
    </div>
    <main>
        <section>
            <h2 class="vuelta">Vuelta a España Etapa 12</h2>

            <div class="table-wrapper">
                <div class="table-content">
                    <table class="sailkapena-table vuelta" id="sailkapena-table">
                        <thead>
                            <tr>
                                <th colspan="4" class="etapa-header">Etapa: 12</th>
                                <th colspan="1" class="etapa-header">...</th>
                                <th colspan="3" class="etapa-header">Eguna: ...</th>
                            </tr>
                            <tr>
                                <th colspan="8" class="main-title">SAILKAPENA</th>
                            </tr>
                            <tr>
                                <th rowspan="2">Posizioa</th>
                                <th rowspan="2">Porreoa</th>
                                <th colspan="2">Puntuak</th>
                                <th rowspan="2">Posizioa</th>
                                <th rowspan="2">Porreoa</th>
                                <th colspan="2">Puntuak</th>

                            <tr>
                                <th>Gaur</th>

                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data will be loaded from CSV -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    <script>
        // Load CSV data when page loads
        window.addEventListener('DOMContentLoaded', function () {
            const csvPath = '/data/CSV/vuelta/vuelta26/2026_etapa_12.csv';
            const profileImagePath = '/data/Etapen Profila/vuelta/vuelta26/Etapa12.jpg';
            
            // For etapa 19 it's .png
            let imagePath = profileImagePath;
            if (12 === 19) {
                imagePath = '/data/Etapen Profila/vuelta/vuelta26/Etapa19.png';
            }

            const metadata = {
                etapa: '12',
                tokia: '',
                data: '',
                profileImagePath: imagePath
            };

            window.csvLoader.loadAndPopulate(csvPath, 'sailkapena-table', metadata);
        });
    </script>
    <footer class="orri-footer">
        <div class="footer-iz">Aramaixo Porra</div>
        <div>Harremanetarako: <a href="mailto:harremana@aramaixoporra.eus">harremana@aramaixoporra.eus</a></div>
